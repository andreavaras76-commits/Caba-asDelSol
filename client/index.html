<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2F5D3A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Meta tags estáticos: los bots de WhatsApp, Instagram y Facebook NO ejecutan JavaScript,
      así que la vista previa al compartir el link sale de acá. React (Helmet) los afina para Google.
    -->
    <title>Cabañas del Sol — Tafí del Valle, Tucumán</title>
    <meta name="description" content="Cabañas con pileta, quincho y desayuno a 1 km de la Villa de Tafí del Valle. Aceptamos mascotas. Consultá disponibilidad por WhatsApp." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Cabañas del Sol — Tafí del Valle" />
    <meta property="og:title" content="Cabañas del Sol — Tafí del Valle" />
    <meta property="og:description" content="En las coordenadas ideales para disfrutar de la placidez y el esparcimiento en los Valles. Pileta, quincho y desayuno a 1 km de la Villa." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cabañas amarillas al pie de los cerros de Tafí del Valle con el sol asomando" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-default.jpg" />

    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <script src="/boot.js"></script>
  </head>
  <body class="bg-crema text-carbon antialiased">
    <noscript>
      <p style="padding:24px;font-family:system-ui;text-align:center">Para ver el sitio activá JavaScript, o escribinos por WhatsApp al (0381) 15-502-7738.</p>
    </noscript>
    <!--
      Shell del hero: el título se pinta apenas llega el HTML (mejor FCP/LCP en celulares).
      Usa las mismas clases que components/public/Hero.jsx; React lo reemplaza al montar sin que se note.
      Si cambiás el layout del hero, actualizá también este bloque.
    -->
    <div id="root"><section id="hero-shell" class="relative isolate flex min-h-[100svh] flex-col overflow-hidden bg-cielo-800" aria-hidden="true">
      <div class="container-sol flex flex-1 flex-col items-center justify-center pb-10 pt-28 text-center text-white sm:pt-32">
        <div class="invisible"><div class="glass relative mb-6 inline-flex rounded-full p-1"><span class="inline-flex items-center gap-1.5 rounded-full px-4 py-2 text-sm font-semibold"><span class="h-4 w-4"></span>Verano</span><span class="inline-flex items-center gap-1.5 rounded-full px-4 py-2 text-sm font-semibold"><span class="h-4 w-4"></span>Invierno</span></div></div>
        <p class="invisible whitespace-nowrap font-sans text-3xl text-sol-200 drop-shadow sm:text-4xl">Cabañas del Sol · Tafí del Valle</p>
        <h1 class="mt-2 max-w-4xl text-balance text-5xl font-semibold leading-[0.95] drop-shadow-[0_4px_24px_rgba(18,39,66,0.45)] sm:text-7xl lg:text-8xl"><span class="inline-block pb-2">Amanece&nbsp;</span><span class="inline-block pb-2">en&nbsp;</span><span class="inline-block pb-2">los&nbsp;</span><span class="inline-block pb-2">Valles&nbsp;</span></h1>
        <p class="invisible mt-5 max-w-xl text-balance text-lg text-white/90 drop-shadow sm:text-xl">En las coordenadas ideales para disfrutar de la placidez y el esparcimiento en los Valles.</p>
        <div class="mt-10 w-full max-w-6xl"><div class="glass invisible h-[400px] w-full rounded-4xl sm:h-[364px] lg:h-[188px]"></div></div>
        <div class="invisible mt-8 hidden flex-col items-center gap-1 text-sm font-semibold sm:flex"><span class="text-xl">Conocé el complejo</span><span class="h-5 w-5"></span></div>
      </div>
    </section></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
